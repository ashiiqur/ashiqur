<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpg" href="favicon.jpg">
    <title>Study Materials</title>
    
    <!-- Google Fonts for better typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #4A90E2;
            --primary-hover: #357ABD;
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            height: fit-content;
        }

        h1 {
            text-align: center;
            font-weight: 700;
            font-size: 2.2rem;
            color: var(--text-main);
            margin-top: 0;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* Search Bar Styling */
        .search-container {
            position: relative;
            margin-bottom: 30px;
        }

        .search-container input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            font-size: 1.1rem;
            font-family: 'Poppins', sans-serif;
            border: 2px solid #e1e5eb;
            border-radius: 50px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            outline: none;
            background-color: #fafbfc;
        }

        .search-container input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(74, 144, 226, 0.2);
            background-color: #ffffff;
        }

        .search-container svg {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: #999;
            transition: 0.3s ease;
        }

        .search-container input:focus + svg {
            fill: var(--primary-color);
        }

        /* Numbered List Styling */
        .topic-list {
            list-style: none;
            padding: 0;
            margin: 0;
            counter-reset: custom-counter;
        }

        .topic-list li {
            position: relative;
            margin-bottom: 15px;
            border-radius: 8px;
            background-color: #ffffff;
            border: 1px solid #f0f0f0;
            transition: all 0.2s ease;
            counter-increment: custom-counter;
        }

        .topic-list li:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-color: #e1e5eb;
        }

        .topic-list a {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 1.1rem;
            transition: color 0.2s ease;
        }

        .topic-list a:hover {
            color: var(--primary-color);
        }

        /* Custom Number Badge */
        .topic-list a::before {
            content: counter(custom-counter);
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 35px;
            height: 35px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 50%;
            margin-right: 15px;
            font-size: 1rem;
            font-weight: 700;
            transition: background-color 0.2s ease;
        }

        .topic-list li:hover a::before {
            background-color: var(--primary-hover);
        }

        /* Empty state styling */
        .no-results {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-style: italic;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>STUDY MATERIALS</h1>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search for a topic...">
            <!-- Search Icon -->
            <svg viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
        </div>

        <div id="noResults" class="no-results">No topics found matching your search.</div>

        <ul class="topic-list" id="topicList">
            <!-- Replace the href '#' with your actual links -->
            <li><a href="https://ashiqur.cariowns.com/study/Quantum_p-Subshell/" target="_blank">Quantum p-Subshell</a></li>
            <li><a href="#" target="_blank">Coming</a></li>
            <li><a href="#" target="_blank">Coming</a></li>
            <li><a href="#" target="_blank">Coming</a></li>
            <li><a href="#" target="_blank">Coming</a></li>
            <li><a href="#" target="_blank">Coming</a></li>
            <li><a href="#" target="_blank">Coming</a></li>
            <li><a href="#" target="_blank">Coming</a></li>
            <li><a href="#" target="_blank">Coming</a></li>
            <li><a href="#" target="_blank">Coming</a></li>
        </ul>
    </div>

    <!-- JavaScript for Search Functionality -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            const topicList = document.getElementById('topicList');
            const listItems = topicList.getElementsByTagName('li');
            const noResults = document.getElementById('noResults');

            searchInput.addEventListener('input', function() {
                const filter = this.value.toLowerCase();
                let visibleCount = 0;

                // Loop through all list items
                for (let i = 0; i < listItems.length; i++) {
                    // Get the text inside the anchor tag
                    const textValue = listItems[i].textContent || listItems[i].innerText;
                    
                    // Check if the text matches the search query
                    if (textValue.toLowerCase().indexOf(filter) > -1) {
                        listItems[i].style.display = "";
                        visibleCount++;
                    } else {
                        listItems[i].style.display = "none";
                    }
                }

                // Show "No results" message if everything is hidden
                if (visibleCount === 0) {
                    noResults.style.display = "block";
                } else {
                    noResults.style.display = "none";
                }
            });
        });
    </script>

</body>
</html>
