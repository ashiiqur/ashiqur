<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Code to WAV Synthesizer</title>
    <style>
        :root {
            /* Premium Rich Gradient Colors */
            --primary: #8b5cf6; 
            --hover: #7c3aed;
            --success: #10b981;
            --success-hover: #059669;
            --text-main: #f8fafc;
            --code-text: #67e8f9; 
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            
            /* THE FIX: Anchor to the top instead of center to prevent jumping */
            justify-content: flex-start; 
            padding: 10vh 20px 40px 20px; 
            
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
            overflow-x: hidden; 
        }

        /* --- Animated Background Shapes --- */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); 
            overflow: hidden;
        }

        .shape {
            position: absolute;
            display: block;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(2px);
            animation: fall linear infinite;
            pointer-events: none; 
            bottom: 100%; 
        }

        .shape:nth-child(1) { left: 10%; width: 80px; height: 80px; animation-duration: 15s; animation-delay: 0s; }
        .shape:nth-child(2) { left: 25%; width: 30px; height: 30px; border-radius: 50%; animation-duration: 12s; animation-delay: 2s; }
        .shape:nth-child(3) { left: 40%; width: 60px; height: 60px; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); animation-duration: 18s; animation-delay: 4s; }
        .shape:nth-child(4) { left: 60%; width: 45px; height: 45px; border-radius: 50%; animation-duration: 14s; animation-delay: 0s; }
        .shape:nth-child(5) { left: 75%; width: 90px; height: 90px; animation-duration: 20s; animation-delay: 3s; }
        .shape:nth-child(6) { left: 85%; width: 50px; height: 50px; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); animation-duration: 16s; animation-delay: 1s; }
        .shape:nth-child(7) { left: 15%; width: 25px; height: 25px; animation-duration: 11s; animation-delay: 5s; }
        .shape:nth-child(8) { left: 50%; width: 70px; height: 70px; border-radius: 50%; animation-duration: 19s; animation-delay: 7s; }

        @keyframes fall {
            0% { transform: translateY(-150px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* --- Animated Typing Header --- */
        .header-container {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            height: 40px;
        }

        .typing-text {
            font-size: 32px;
            font-weight: 700;
            border-right: 3px solid var(--primary);
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            animation: typing 2.5s steps(30, end) forwards, blink 0.8s step-end infinite;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: var(--primary); }
        }

        /* --- Premium Glassmorphism Editor Layout --- */
        .editor-container {
            background: rgba(17, 24, 39, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        label {
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            height: 280px;
            background: rgba(0, 0, 0, 0.5); 
            color: var(--code-text);
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 14px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            resize: vertical;
            outline: none;
            box-sizing: border-box;
            line-height: 1.5;
            transition: all 0.3s;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.3);
            background: rgba(0, 0, 0, 0.7);
        }

        /* Interactive Buttons */
        .btn-group {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--hover));
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5);
        }

        button:active {
            transform: translateY(1px);
        }

        #download-btn {
            background: linear-gradient(135deg, var(--success), var(--success-hover));
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        #download-btn:hover {
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
        }

        #status {
            font-size: 14px;
            font-weight: 600;
        }

        /* Preview Interface Section */
        #preview-section {
            display: none; 
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        audio {
            width: 100%;
            border-radius: 8px;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        audio::-webkit-media-controls-panel {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display {
            color: white;
        }
    </style>
</head>
<body>

    <!-- Falling Shapes Background -->
    <div class="bg-animation">
        <ul style="padding:0; margin:0;">
            <li class="shape"></li>
            <li class="shape"></li>
            <li class="shape"></li>
            <li class="shape"></li>
            <li class="shape"></li>
            <li class="shape"></li>
            <li class="shape"></li>
            <li class="shape"></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="header-container">
        <div class="typing-text">Code to WAV Converter</div>
    </div>

    <div class="editor-container">
        <label>Write Web Audio API JavaScript (variables `offlineCtx` and `now` are provided):</label>
        
        <textarea id="code-input" spellcheck="false">
// This code generates a soft C Major Chord arpeggio
const freqs = [523.25, 659.25, 783.99, 1046.50];

freqs.forEach((freq, index) => {
    const osc = offlineCtx.createOscillator();
    const gainNode = offlineCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now + (index * 0.05));

    gainNode.gain.setValueAtTime(0, now);
    gainNode.gain.linearRampToValueAtTime(0.06, now + (index * 0.05) + 0.02);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.8 + (index * 0.05));

    osc.connect(gainNode);
    gainNode.connect(offlineCtx.destination);

    osc.start(now + (index * 0.05));
    osc.stop(now + 0.8 + (index * 0.05));
});
</textarea>

        <div class="btn-group">
            <div id="status"></div>
            <button onclick="generatePreview()">Generate Preview</button>
        </div>

        <div id="preview-section">
            <label>Preview Generated Audio:</label>
            <audio id="audio-player" controls></audio>
            
            <div class="btn-group">
                <button id="download-btn" onclick="downloadAudio()">📥 Download WAV</button>
            </div>
        </div>
    </div>

    <script>
        let currentAudioUrl = null; 

        async function generatePreview() {
            const statusDiv = document.getElementById('status');
            const userCode = document.getElementById('code-input').value;
            const previewSection = document.getElementById('preview-section');
            const audioPlayer = document.getElementById('audio-player');
            
            previewSection.style.display = 'none';
            statusDiv.style.color = 'var(--code-text)';
            statusDiv.innerText = "Processing...";

            try {
                const duration = 2.0;
                const sampleRate = 44100;
                const offlineCtx = new OfflineAudioContext(1, sampleRate * duration, sampleRate);
                const now = offlineCtx.currentTime;

                const userFunction = new Function('offlineCtx', 'now', userCode);
                userFunction(offlineCtx, now);

                const renderedBuffer = await offlineCtx.startRendering();
                const wavBlob = bufferToWav(renderedBuffer);
                
                if (currentAudioUrl) {
                    URL.revokeObjectURL(currentAudioUrl);
                }

                currentAudioUrl = URL.createObjectURL(wavBlob);
                audioPlayer.src = currentAudioUrl;
                
                previewSection.style.display = 'flex';
                statusDiv.innerText = ""; 

            } catch (error) {
                console.error(error);
                statusDiv.style.color = '#ef4444'; 
                statusDiv.innerText = "❌ Error in your code. Check console.";
            }
        }

        function downloadAudio() {
            if (!currentAudioUrl) return;
            
            const a = document.createElement('a');
            a.href = currentAudioUrl;
            a.download = 'Custom_Audio.wav';
            a.click();
        }

        function bufferToWav(abuffer) {
            let numOfChan = abuffer.numberOfChannels;
            let length = abuffer.length * numOfChan * 2 + 44;
            let buffer = new ArrayBuffer(length);
            let view = new DataView(buffer);
            let channels = [], sample, offset = 0, pos = 0;

            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952); 
            setUint32(length - 8); 
            setUint32(0x45564157); 
            setUint32(0x20746d66); 
            setUint32(16);         
            setUint16(1);          
            setUint16(numOfChan);
            setUint32(abuffer.sampleRate);
            setUint32(abuffer.sampleRate * 2 * numOfChan); 
            setUint16(numOfChan * 2); 
            setUint16(16);         

            setUint32(0x61746164); 
            setUint32(length - pos - 4); 

            for(let i = 0; i < abuffer.numberOfChannels; i++) {
                channels.push(abuffer.getChannelData(i));
            }

            while(pos < length) {
                for(let i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset])); 
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0; 
                    view.setInt16(pos, sample, true); 
                    pos += 2;
                }
                offset++;
            }

            return new Blob([buffer], {type: "audio/wav"});
        }
    </script>
</body>
</html>
