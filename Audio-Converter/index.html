<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Audio Converter</title>
    <style>
        :root {
            /* Premium Rich Gradient Colors */
            --primary: #8b5cf6; 
            --hover: #7c3aed;
            --success: #10b981;
            --success-hover: #059669;
            --text-main: #f8fafc;
            --code-text: #67e8f9; 
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            /* 100px top padding ensures content clears the fixed navbar */
            padding: 100px 20px 40px 20px; 
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
            overflow-x: hidden; 
        }

        /* --- Animated Background Shapes --- */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); 
            overflow: hidden;
        }

        .shape {
            position: absolute;
            display: block;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(2px);
            animation: fall linear infinite;
            pointer-events: none; 
            bottom: 100%; 
        }

        .shape:nth-child(1) { left: 10%; width: 80px; height: 80px; animation-duration: 15s; animation-delay: 0s; }
        .shape:nth-child(2) { left: 25%; width: 30px; height: 30px; border-radius: 50%; animation-duration: 12s; animation-delay: 2s; }
        .shape:nth-child(3) { left: 40%; width: 60px; height: 60px; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); animation-duration: 18s; animation-delay: 4s; }
        .shape:nth-child(4) { left: 60%; width: 45px; height: 45px; border-radius: 50%; animation-duration: 14s; animation-delay: 0s; }
        .shape:nth-child(5) { left: 75%; width: 90px; height: 90px; animation-duration: 20s; animation-delay: 3s; }
        .shape:nth-child(6) { left: 85%; width: 50px; height: 50px; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); animation-duration: 16s; animation-delay: 1s; }
        .shape:nth-child(7) { left: 15%; width: 25px; height: 25px; animation-duration: 11s; animation-delay: 5s; }
        .shape:nth-child(8) { left: 50%; width: 70px; height: 70px; border-radius: 50%; animation-duration: 19s; animation-delay: 7s; }

        @keyframes fall {
            0% { transform: translateY(-150px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* --- LIQUID GLASS FLOATING NAV BAR --- */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 1000;
            
            /* Glassmorphism Styles */
            background: linear-gradient(135deg, rgba(20, 25, 40, 0.75) 0%, rgba(10, 15, 25, 0.55) 100%);
            backdrop-filter: blur(20px) saturate(120%);
            -webkit-backdrop-filter: blur(20px) saturate(120%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 -1px 0 rgba(255,255,255,0.05);
            
            /* Extremely Smooth Hardware-Accelerated Transition */
            transition: transform 0.4s ease-in-out;
            will-change: transform;
        }

        .header-hidden {
            transform: translateY(-100%);
        }

        .nav-logo {
            height: 36px;
            width: 36px;
            object-fit: contain;
            border-radius: 8px; /* Optional: smooth edges for the logo */
        }

        .nav-middle {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 2px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .nav-right-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-right-btn svg {
            fill: var(--text-main);
            width: 24px;
            height: 24px;
            transition: fill 0.2s ease, transform 0.2s ease;
        }

        .nav-right-btn:hover svg {
            fill: var(--primary);
            transform: scale(1.1);
        }

        /* --- TITLE BLOCK (Now located in the main body) --- */
        .title-block {
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 10;
        }

        .main-title {
            font-size: 36px;
            font-weight: 700;
            margin: 0;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            background: linear-gradient(135deg, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-title {
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 2.5px;
            margin-top: 8px;
            text-transform: uppercase;
        }

        /* --- LIQUID GLASS EDITOR LAYOUT --- */
        .editor-container {
            background: linear-gradient(135deg, rgba(20, 25, 40, 0.6) 0%, rgba(10, 15, 25, 0.4) 100%);
            backdrop-filter: blur(24px) saturate(120%);
            -webkit-backdrop-filter: blur(24px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            padding: 24px;
            border-radius: 20px; 
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        label {
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3); 
        }

        .toolbar-group {
            display: flex;
            gap: 8px;
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: inset 0 0 5px rgba(255, 255, 255, 0.05);
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-1px);
        }

        textarea {
            width: 100%;
            height: 380px;
            background: rgba(0, 0, 0, 0.35); 
            color: var(--code-text);
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 14px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            resize: vertical;
            outline: none;
            box-sizing: border-box;
            line-height: 1.5;
            transition: all 0.3s;
            box-shadow: inset 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: inset 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 0 3px rgba(139, 92, 246, 0.3);
            background: rgba(0, 0, 0, 0.5);
        }

        /* Clean Editor Footer */
        .editor-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
        }

        #status {
            font-size: 14px;
            font-weight: 600;
            flex-grow: 1;
            text-align: right;
            transition: color 0.3s;
        }

        .action-btn {
            background: linear-gradient(135deg, var(--primary), var(--hover));
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-top: 1px solid rgba(255,255,255,0.4);
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5);
        }

        .action-btn:active {
            transform: translateY(1px);
        }

        #download-btn {
            background: linear-gradient(135deg, var(--success), var(--success-hover));
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        #download-btn:hover {
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
        }

        /* --- Custom Audio Player Interface --- */
        #preview-section {
            display: none; 
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .custom-player {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.4);
            width: 100%;
            box-sizing: border-box;
        }

        .play-pause-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            transition: transform 0.2s, color 0.2s;
        }
        
        .play-pause-btn:hover {
            transform: scale(1.15);
            color: var(--primary);
        }

        .time-display {
            font-size: 13px;
            color: #cbd5e1;
            font-family: 'Fira Code', monospace;
            min-width: 40px;
            text-align: center;
            user-select: none;
        }

        #seek-slider {
            flex-grow: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: rgba(255, 255, 255, 0.3); 
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        #seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.1s;
        }

        #seek-slider::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }
    </style>
</head>
<body>

    <div class="bg-animation">
        <ul style="padding:0; margin:0;">
            <li class="shape"></li><li class="shape"></li><li class="shape"></li><li class="shape"></li>
            <li class="shape"></li><li class="shape"></li><li class="shape"></li><li class="shape"></li>
        </ul>
    </div>

    <!-- NEW Floating Liquid Glass Navbar -->
    <div class="top-nav" id="main-header">
        <img src="favicon.png" alt="Logo" class="nav-logo" onerror="this.style.display='none'">
        <div class="nav-middle">WAVC</div>
        <button class="nav-right-btn" aria-label="Menu">
            <!-- 3 Dots SVG Icon -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="5" r="2.5"/>
                <circle cx="12" cy="12" r="2.5"/>
                <circle cx="12" cy="19" r="2.5"/>
            </svg>
        </button>
    </div>

    <!-- Titles Restored Back to the Body Layout -->
    <div class="title-block">
        <h1 class="main-title">Code to WAV Converter</h1>
        <div class="sub-title">Process locally on device</div>
    </div>

    <div class="editor-container">
        
        <div class="editor-header">
            <label>Write Web Audio API JavaScript:</label>
            <div class="toolbar-group">
                <button class="tool-btn" onclick="copyCode()" id="copy-btn">Copy</button>
                <button class="tool-btn" onclick="pasteCode()">Paste</button>
            </div>
        </div>
        
        <textarea id="code-input" spellcheck="false">
// 1. Define the audio length in seconds (The engine will read this!)
const DURATION = 2.0; 

// 2. This code generates a soft C Major Chord arpeggio
const freqs = [523.25, 659.25, 783.99, 1046.50];

freqs.forEach((freq, index) => {
    const osc = offlineCtx.createOscillator();
    const gainNode = offlineCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now + (index * 0.05));

    gainNode.gain.setValueAtTime(0, now);
    gainNode.gain.linearRampToValueAtTime(0.06, now + (index * 0.05) + 0.02);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.8 + (index * 0.05));

    osc.connect(gainNode);
    gainNode.connect(offlineCtx.destination);

    osc.start(now + (index * 0.05));
    osc.stop(now + 0.8 + (index * 0.05)); 
});
</textarea>

        <div class="editor-footer">
            <div id="status"></div>
            <button class="action-btn" onclick="generatePreview()">Generate Preview</button>
        </div>

        <div id="preview-section">
            <label>Preview Generated Audio:</label>
            
            <audio id="audio-player" style="display: none;"></audio>
            
            <div class="custom-player">
                <button class="play-pause-btn" id="play-btn" onclick="togglePlay()">▶</button>
                <span class="time-display" id="time-current">0:00</span>
                <input type="range" id="seek-slider" value="0" step="0.01">
                <span class="time-display" id="time-total">0:00</span>
            </div>
            
            <div class="editor-footer" style="margin-top: 10px;">
                <button class="action-btn" id="download-btn" onclick="downloadAudio()">Download WAV</button>
            </div>
        </div>
    </div>

    <script>
        // --- Smooth Scroll Logic ---
        let lastScrollTop = 0;
        const header = document.getElementById('main-header');

        window.addEventListener('scroll', () => {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            // Adding a small math threshold prevents micro-jitters
            if (Math.abs(lastScrollTop - scrollTop) <= 5) return;
            
            // If scrolling down and past 60px, smoothly slide header up
            if (scrollTop > lastScrollTop && scrollTop > 60) {
                header.classList.add('header-hidden');
            } else {
                // If scrolling up, smoothly slide it back down
                header.classList.remove('header-hidden');
            }
            
            lastScrollTop = scrollTop;
        });

        // --- Audio Engine Logic ---
        let currentAudioUrl = null; 

        // Copy Logic
        async function copyCode() {
            const codeInput = document.getElementById('code-input');
            const copyBtn = document.getElementById('copy-btn');
            try {
                await navigator.clipboard.writeText(codeInput.value);
                copyBtn.innerText = 'Copied!';
                setTimeout(() => { copyBtn.innerText = 'Copy'; }, 2000);
            } catch (err) { alert('Copy failed. Please copy manually.'); }
        }

        // Paste Logic 
        async function pasteCode() {
            const codeInput = document.getElementById('code-input');
            try {
                const text = await navigator.clipboard.readText();
                codeInput.focus();
                codeInput.setRangeText(text, codeInput.selectionStart, codeInput.selectionEnd, 'end');
            } catch (err) { alert('Please allow clipboard permissions or paste manually.'); }
        }

        // Custom Player Elements
        const audioPlayer = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const seekSlider = document.getElementById('seek-slider');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');

        async function generatePreview() {
            const statusDiv = document.getElementById('status');
            const userCode = document.getElementById('code-input').value;
            const previewSection = document.getElementById('preview-section');
            
            // Auto-Detects DURATION variable in code
            let duration = 2.0; 
            const durationMatch = userCode.match(/duration\s*=\s*([\d.]+)/i);
            if (durationMatch) {
                duration = parseFloat(durationMatch[1]);
            }

            statusDiv.style.color = 'var(--code-text)';
            statusDiv.innerText = "Processing...";

            try {
                const sampleRate = 44100;
                const offlineCtx = new OfflineAudioContext(1, sampleRate * duration, sampleRate);
                const now = offlineCtx.currentTime;

                const userFunction = new Function('offlineCtx', 'now', userCode);
                userFunction(offlineCtx, now);

                const renderedBuffer = await offlineCtx.startRendering();
                const wavBlob = bufferToWav(renderedBuffer);
                
                if (currentAudioUrl) {
                    URL.revokeObjectURL(currentAudioUrl);
                }

                currentAudioUrl = URL.createObjectURL(wavBlob);
                audioPlayer.src = currentAudioUrl;
                
                playBtn.innerText = '▶';
                seekSlider.value = 0;
                seekSlider.style.background = 'rgba(255, 255, 255, 0.3)';
                timeCurrent.innerText = '0:00';
                timeTotal.innerText = '0:00';

                // Reveal only if currently hidden
                if (previewSection.style.display !== 'flex') {
                    previewSection.style.display = 'flex';
                }
                
                statusDiv.style.color = 'var(--success)';
                statusDiv.innerText = "Updated!";
                setTimeout(() => { 
                    if (statusDiv.innerText === "Updated!") statusDiv.innerText = ""; 
                }, 2000);

            } catch (error) {
                console.error(error);
                statusDiv.style.color = '#ef4444'; 
                statusDiv.innerText = "❌ Error in code. Check console.";
            }
        }

        // Custom Player Play/Pause Logic
        function togglePlay() {
            if (audioPlayer.paused) {
                audioPlayer.play();
                playBtn.innerText = '⏸';
            } else {
                audioPlayer.pause();
                playBtn.innerText = '▶';
            }
        }

        audioPlayer.addEventListener('loadedmetadata', () => {
            seekSlider.max = audioPlayer.duration;
            timeTotal.innerText = formatTime(audioPlayer.duration);
        });

        audioPlayer.addEventListener('timeupdate', () => {
            seekSlider.value = audioPlayer.currentTime;
            timeCurrent.innerText = formatTime(audioPlayer.currentTime);
            const percentage = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            seekSlider.style.background = `linear-gradient(to right, var(--primary) ${percentage}%, rgba(255, 255, 255, 0.3) ${percentage}%)`;
        });

        seekSlider.addEventListener('input', () => {
            audioPlayer.currentTime = seekSlider.value;
        });

        audioPlayer.addEventListener('ended', () => {
            playBtn.innerText = '▶';
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // WAV Encoding Logic
        function downloadAudio() {
            if (!currentAudioUrl) return;
            const a = document.createElement('a');
            a.href = currentAudioUrl;
            a.download = 'Custom_Audio.wav';
            a.click();
        }

        function bufferToWav(abuffer) {
            let numOfChan = abuffer.numberOfChannels;
            let length = abuffer.length * numOfChan * 2 + 44;
            let buffer = new ArrayBuffer(length);
            let view = new DataView(buffer);
            let channels = [], sample, offset = 0, pos = 0;

            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157); 
            setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
            setUint32(abuffer.sampleRate); setUint32(abuffer.sampleRate * 2 * numOfChan); 
            setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); 
            setUint32(length - pos - 4); 

            for(let i = 0; i < abuffer.numberOfChannels; i++) {
                channels.push(abuffer.getChannelData(i));
            }
            while(pos < length) {
                for(let i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset])); 
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0; 
                    view.setInt16(pos, sample, true); 
                    pos += 2;
                }
                offset++;
            }
            return new Blob([buffer], {type: "audio/wav"});
        }
    </script>
</body>
</html>
