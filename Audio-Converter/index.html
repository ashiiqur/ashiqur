<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code to WAV Synthesizer</title>
    <style>
        :root {
            /* Changed to pure black */
            --bg-color: #000000; 
            --container-bg: #111827;
            --primary: #3b82f6;
            --hover: #2563eb;
            --success: #10b981;
            --success-hover: #059669;
            --text-main: #f8fafc;
            --code-text: #38bdf8;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Animated Typing Header */
        .header-container {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            height: 40px;
        }

        .typing-text {
            font-size: 28px;
            font-weight: 700;
            border-right: 3px solid var(--primary);
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            animation: typing 2.5s steps(30, end) forwards, blink 0.8s step-end infinite;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: var(--primary); }
        }

        /* Editor Layout */
        .editor-container {
            background: var(--container-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #1f2937;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.1); /* Subtle blue glow on black bg */
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            height: 280px;
            background: #030712;
            color: var(--code-text);
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 14px;
            padding: 15px;
            border: 1px solid #334155;
            border-radius: 8px;
            resize: vertical;
            outline: none;
            box-sizing: border-box;
            line-height: 1.5;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* Interactive Buttons */
        .btn-group {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover {
            background: var(--hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(59, 130, 246, 0.4);
        }

        button:active {
            transform: translateY(1px);
        }

        #download-btn {
            background: var(--success);
        }

        #download-btn:hover {
            background: var(--success-hover);
            box-shadow: 0 8px 15px rgba(16, 185, 129, 0.4);
        }

        #status {
            font-size: 14px;
            font-weight: 600;
        }

        /* Preview Interface Section */
        #preview-section {
            display: none; /* Hidden until generated */
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
            padding-top: 20px;
            border-top: 1px solid #334155;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        audio {
            width: 100%;
            border-radius: 8px;
            outline: none;
        }
        
        audio::-webkit-media-controls-panel {
            background-color: #1f2937;
        }
        
        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display {
            color: white;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="typing-text">Code to WAV Converter</div>
    </div>

    <div class="editor-container">
        <label>Write Web Audio API JavaScript (variables `offlineCtx` and `now` are provided):</label>
        
        <textarea id="code-input" spellcheck="false">
// This code generates a soft C Major Chord arpeggio
const freqs = [523.25, 659.25, 783.99, 1046.50];

freqs.forEach((freq, index) => {
    const osc = offlineCtx.createOscillator();
    const gainNode = offlineCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now + (index * 0.05));

    gainNode.gain.setValueAtTime(0, now);
    gainNode.gain.linearRampToValueAtTime(0.06, now + (index * 0.05) + 0.02);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.8 + (index * 0.05));

    osc.connect(gainNode);
    gainNode.connect(offlineCtx.destination);

    osc.start(now + (index * 0.05));
    osc.stop(now + 0.8 + (index * 0.05));
});
</textarea>

        <div class="btn-group">
            <div id="status"></div>
            <button onclick="generatePreview()">Generate Preview</button>
        </div>

        <!-- NEW: Preview and Download Section -->
        <div id="preview-section">
            <label>Preview Generated Audio:</label>
            <audio id="audio-player" controls></audio>
            
            <div class="btn-group">
                <button id="download-btn" onclick="downloadAudio()">📥 Download WAV</button>
            </div>
        </div>
    </div>

    <script>
        let currentAudioUrl = null; // Memory to hold the generated audio file

        async function generatePreview() {
            const statusDiv = document.getElementById('status');
            const userCode = document.getElementById('code-input').value;
            const previewSection = document.getElementById('preview-section');
            const audioPlayer = document.getElementById('audio-player');
            
            // Hide previous preview while processing
            previewSection.style.display = 'none';
            statusDiv.style.color = '#38bdf8';
            statusDiv.innerText = "Processing...";

            try {
                // Set up the Offline Audio Environment (2 seconds long)
                const duration = 2.0;
                const sampleRate = 44100;
                const offlineCtx = new OfflineAudioContext(1, sampleRate * duration, sampleRate);
                const now = offlineCtx.currentTime;

                // Execute the user's code safely inside this specific function scope
                const userFunction = new Function('offlineCtx', 'now', userCode);
                userFunction(offlineCtx, now);

                // Render the audio
                const renderedBuffer = await offlineCtx.startRendering();
                
                // Convert to WAV
                const wavBlob = bufferToWav(renderedBuffer);
                
                // Cleanup the old memory URL if the user clicks generate multiple times
                if (currentAudioUrl) {
                    URL.revokeObjectURL(currentAudioUrl);
                }

                // Create new URL and set it to the audio player
                currentAudioUrl = URL.createObjectURL(wavBlob);
                audioPlayer.src = currentAudioUrl;
                
                // Reveal the player and download button
                previewSection.style.display = 'flex';
                statusDiv.innerText = ""; // Clear processing text

            } catch (error) {
                console.error(error);
                statusDiv.style.color = '#ef4444'; /* Red error color */
                statusDiv.innerText = "❌ Error in your code. Check console.";
            }
        }

        function downloadAudio() {
            if (!currentAudioUrl) return;
            
            const a = document.createElement('a');
            a.href = currentAudioUrl;
            a.download = 'Custom_Audio.wav';
            a.click();
        }

        // Standard function to encode a raw audio buffer into a playable WAV file
        function bufferToWav(abuffer) {
            let numOfChan = abuffer.numberOfChannels;
            let length = abuffer.length * numOfChan * 2 + 44;
            let buffer = new ArrayBuffer(length);
            let view = new DataView(buffer);
            let channels = [], sample, offset = 0, pos = 0;

            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952); // "RIFF"
            setUint32(length - 8); // file length - 8
            setUint32(0x45564157); // "WAVE"
            setUint32(0x20746d66); // "fmt " chunk
            setUint32(16);         // length = 16
            setUint16(1);          // PCM (uncompressed)
            setUint16(numOfChan);
            setUint32(abuffer.sampleRate);
            setUint32(abuffer.sampleRate * 2 * numOfChan); // avg. bytes/sec
            setUint16(numOfChan * 2); // block-align
            setUint16(16);         // 16-bit

            setUint32(0x61746164); // "data" - chunk
            setUint32(length - pos - 4); // chunk length

            for(let i = 0; i < abuffer.numberOfChannels; i++) {
                channels.push(abuffer.getChannelData(i));
            }

            while(pos < length) {
                for(let i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset])); // clamp
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0; // scale to 16-bit
                    view.setInt16(pos, sample, true); 
                    pos += 2;
                }
                offset++;
            }

            return new Blob([buffer], {type: "audio/wav"});
        }
    </script>
</body>
</html>
